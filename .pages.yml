media: media

content:
  - name: homepage
    label: Page d'accueil (HTML)
    type: file
    path: index.html
    format: code
    fields: []

  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date de publication
        type: date
        required: true
      - name: category
        label: Catégorie
        type: string
      - name: image
        label: Photo de couverture
        type: image
      - name: excerpt
        label: Résumé
        type: text
      - name: body
        label: Contenu de l'article
        type: rich-text

  - name: urgent
    label: Alerte urgente
    type: file
    path: content/urgent.json
    format: json
    fields:
      - name: active
        label: Afficher la bande d'urgence
        type: boolean
        default: false
        description: Activez uniquement lorsqu'une information urgente vérifiée doit être diffusée.
      - name: message
        label: Message urgent
        type: text
        description: Texte court et factuel à afficher sur le site.
      - name: url
        label: Lien complémentaire
        type: string
        description: Facultatif. Adresse d'un article ou d'une source officielle.

  - name: advertisements
    label: Publicités & partenaires
    type: collection
    path: content/ads
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, position, active]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Nom de l'annonceur
        type: string
        required: true
      - name: active
        label: Publicité activée
        type: boolean
        default: false
      - name: position
        label: Emplacement
        type: select
        options:
          values:
            - value: accueil
              label: Bannière page d'accueil
            - value: article
              label: Entre les articles
            - value: partenaire
              label: Partenaire / publireportage
      - name: image
        label: Visuel publicitaire
        type: image
      - name: excerpt
        label: Description courte
        type: text
      - name: url
        label: Lien de destination
        type: string
